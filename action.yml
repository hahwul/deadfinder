---
name: DeadFinder Action
description: A GitHub Action to find and report dead (broken) links in files, URLs, or sitemaps.
branding:
  icon: link
  color: red
inputs:
  command:
    description: The type of command to execute (e.g.,file, url, sitemap)
    required: true
  target:
    description: The target resource for the command (e.g., file path, URL, or sitemap URL)
    required: true
  timeout:
    description: The maximum time to wait for each request, in seconds
    required: false
    default: ""
  concurrency:
    description: The number of concurrent requests to make
    required: false
    default: ""
  silent:
    description: Enable silent mode to suppress output
    required: false
    default: "false"
  headers:
    description: Custom HTTP headers to include in requests, separated by commas
    required: false
    default: ""
  worker_headers:
    description: Custom HTTP headers for worker requests, separated by commas
    required: false
    default: ""
  verbose:
    description: Enable verbose mode for detailed logging
    required: false
    default: "false"
  include30x:
    description: Include HTTP 30x status codes in the results
    required: false
    default: "false"
  user_agent:
    description: User-Agent string to use for requests
    required: false
    default: ""
  proxy:
    description: Proxy server to use for requests
    required: false
    default: ""
  proxy_auth:
    description: Proxy server authentication credentials
    required: false
    default: ""
  insecure:
    description: Skip TLS certificate verification (not recommended)
    required: false
    default: "false"
  match:
    description: Match the URL with the given pattern
    required: false
    default: ""
  ignore:
    description: Ignore the URL with the given pattern
    required: false
    default: ""
  limit:
    description: Maximum number of input URLs to scan (empty or 0 for no limit)
    required: false
    default: ""
  output_format:
    description: "Result format: json, yaml, toml, csv, or sarif"
    required: false
    default: "json"
  target_concurrency:
    description: Number of targets scanned in parallel (total in-flight requests stay capped by `concurrency`)
    required: false
    default: ""
  method:
    description: "Link check method: auto, head, or get"
    required: false
    default: ""
  retry:
    description: Retry a transient failure (connection error, timeout, 429, 5xx) this many times
    required: false
    default: ""
  delay:
    description: Minimum milliseconds between two requests to the same host
    required: false
    default: ""
  accept_status:
    description: Statuses to treat as alive, e.g. "403,999" or "400-499"
    required: false
    default: ""
  dead_status:
    description: Statuses to treat as dead, e.g. "500-599"
    required: false
    default: ""
  check_anchors:
    description: Verify that #fragment link targets exist in the linked document
    required: false
    default: "false"
  fail_on_dead:
    description: Fail this step (exit 2) when any dead link or dead target is found
    required: false
    default: "false"
  coverage:
    description: Enable coverage reporting to show dead link ratios
    required: false
    default: "false"
  visualize:
    description: Generate a visualization of the scan results (e.g., report.png)
    required: false
    default: ""
  version:
    description: "DeadFinder release tag to download (default: latest)"
    required: false
    default: "latest"
outputs:
  output:
    description: Result of the dead-link check, serialized with `output_format` (JSON by default)
    value: ${{ steps.scan.outputs.output }}
runs:
  using: composite
  steps:
    - name: Detect platform
      id: platform
      shell: bash
      run: |
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   asset="deadfinder-linux-x86_64.tar.gz"  ;;
          Linux-ARM64) asset="deadfinder-linux-aarch64.tar.gz" ;;
          macOS-ARM64) asset="deadfinder-macos-arm64.tar.gz"   ;;
          macOS-X64)
            echo "::error title=macOS Intel not supported::DeadFinder no longer ships a macOS x86_64 prebuilt binary. Use an Apple Silicon (macos-latest) runner, or install from source via 'brew install deadfinder'."
            exit 1
            ;;
          *) echo "::error::Unsupported platform: ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        echo "asset=${asset}" >> "$GITHUB_OUTPUT"

    - name: Download deadfinder binary
      shell: bash
      run: |
        set -e
        version="${{ inputs.version }}"
        asset="${{ steps.platform.outputs.asset }}"
        if [ "${version}" = "latest" ]; then
          base_url="https://github.com/hahwul/deadfinder/releases/latest/download"
        else
          base_url="https://github.com/hahwul/deadfinder/releases/download/${version}"
        fi
        echo "Downloading ${base_url}/${asset}"
        # The sha256 sidecar was generated with the tarball's real filename
        # (deadfinder-linux-x86_64.tar.gz etc.), so we must save the download
        # under the same name for `sha256sum -c` to resolve it.
        if ! curl -fsSL "${base_url}/${asset}" -o "/tmp/${asset}"; then
          echo "::error title=DeadFinder binary not found::Failed to download ${base_url}/${asset}"
          echo "::error::Common causes:"
          echo "::error::  1. Using 'uses: hahwul/deadfinder@main' or '@latest' — neither resolves to a release."
          echo "::error::     → Pin a released ref instead: uses: hahwul/deadfinder@v2 (latest 2.x) or @2.0.2 (exact)."
          echo "::error::  2. Requested version (input: version=${version}) is not a published release tag."
          echo "::error::     → See https://github.com/hahwul/deadfinder/releases for available tags."
          echo "::error::  3. Using a v1.x workflow with a v2 ref — v1 users should pin hahwul/deadfinder@1.10.0."
          exit 1
        fi
        if ! curl -fsSL "${base_url}/${asset}.sha256" -o "/tmp/${asset}.sha256"; then
          echo "::error::Downloaded ${asset} but its .sha256 sidecar is missing at ${base_url}/${asset}.sha256"
          exit 1
        fi
        cd /tmp
        # macOS runners ship `shasum`, Linux ships `sha256sum`.
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c "${asset}.sha256"
        else
          shasum -a 256 -c "${asset}.sha256"
        fi
        tar xzf "${asset}"
        chmod +x deadfinder
        ./deadfinder version

    - name: Run deadfinder
      id: scan
      shell: bash
      env:
        DF_COMMAND:        ${{ inputs.command }}
        DF_TARGET:         ${{ inputs.target }}
        DF_TIMEOUT:        ${{ inputs.timeout }}
        DF_CONCURRENCY:    ${{ inputs.concurrency }}
        DF_SILENT:         ${{ inputs.silent }}
        DF_HEADERS:        ${{ inputs.headers }}
        DF_WORKER_HEADERS: ${{ inputs.worker_headers }}
        DF_VERBOSE:        ${{ inputs.verbose }}
        DF_INCLUDE30X:     ${{ inputs.include30x }}
        DF_USER_AGENT:     ${{ inputs.user_agent }}
        DF_PROXY:          ${{ inputs.proxy }}
        DF_PROXY_AUTH:     ${{ inputs.proxy_auth }}
        DF_INSECURE:       ${{ inputs.insecure }}
        DF_MATCH:          ${{ inputs.match }}
        DF_IGNORE:         ${{ inputs.ignore }}
        DF_LIMIT:          ${{ inputs.limit }}
        DF_OUTPUT_FORMAT:  ${{ inputs.output_format }}
        DF_TARGET_CONCURRENCY: ${{ inputs.target_concurrency }}
        DF_METHOD:         ${{ inputs.method }}
        DF_RETRY:          ${{ inputs.retry }}
        DF_DELAY:          ${{ inputs.delay }}
        DF_ACCEPT_STATUS:  ${{ inputs.accept_status }}
        DF_DEAD_STATUS:    ${{ inputs.dead_status }}
        DF_CHECK_ANCHORS:  ${{ inputs.check_anchors }}
        DF_FAIL_ON_DEAD:   ${{ inputs.fail_on_dead }}
        DF_COVERAGE:       ${{ inputs.coverage }}
        DF_VISUALIZE:      ${{ inputs.visualize }}
      run: |
        set -e
        # Every conditional below is a `[ test ] && args+=(...)` list, whose
        # exit status is the test's. Under `set -e` that is harmless mid-script
        # (the failing command is the left side of a `&&`), but the step's own
        # status is that of its LAST command — so never end this script on one.
        fmt="${DF_OUTPUT_FORMAT:-json}"
        args=( "${DF_COMMAND}" "${DF_TARGET}" -o /tmp/output.json -f "${fmt}" )
        [ -n "${DF_TIMEOUT}" ]     && args+=( --timeout="${DF_TIMEOUT}" )
        [ -n "${DF_CONCURRENCY}" ] && args+=( --concurrency="${DF_CONCURRENCY}" )
        [ "${DF_SILENT}" = "true" ]     && args+=( --silent )
        [ "${DF_VERBOSE}" = "true" ]    && args+=( --verbose )
        [ "${DF_INCLUDE30X}" = "true" ] && args+=( --include30x )
        [ -n "${DF_USER_AGENT}" ]     && args+=( --user_agent="${DF_USER_AGENT}" )
        [ -n "${DF_PROXY}" ]          && args+=( --proxy="${DF_PROXY}" )
        [ -n "${DF_PROXY_AUTH}" ]     && args+=( --proxy_auth="${DF_PROXY_AUTH}" )
        [ "${DF_INSECURE}" = "true" ] && args+=( --insecure )
        [ -n "${DF_MATCH}" ]          && args+=( --match="${DF_MATCH}" )
        [ -n "${DF_IGNORE}" ]         && args+=( --ignore="${DF_IGNORE}" )
        [ -n "${DF_LIMIT}" ]          && args+=( --limit="${DF_LIMIT}" )
        [ -n "${DF_TARGET_CONCURRENCY}" ] && args+=( --target-concurrency="${DF_TARGET_CONCURRENCY}" )
        [ -n "${DF_METHOD}" ]         && args+=( --method="${DF_METHOD}" )
        [ -n "${DF_RETRY}" ]          && args+=( --retry="${DF_RETRY}" )
        [ -n "${DF_DELAY}" ]          && args+=( --delay="${DF_DELAY}" )
        [ -n "${DF_ACCEPT_STATUS}" ]  && args+=( --accept-status="${DF_ACCEPT_STATUS}" )
        [ -n "${DF_DEAD_STATUS}" ]    && args+=( --dead-status="${DF_DEAD_STATUS}" )
        [ "${DF_CHECK_ANCHORS}" = "true" ] && args+=( --check-anchors )
        [ "${DF_COVERAGE}" = "true" ] && args+=( --coverage )
        [ -n "${DF_VISUALIZE}" ]      && args+=( --visualize="${DF_VISUALIZE}" )

        if [ -n "${DF_HEADERS}" ]; then
          IFS=',' read -ra hdrs <<< "${DF_HEADERS}"
          for h in "${hdrs[@]}"; do
            [ -n "${h}" ] && args+=( -H "${h}" )
          done
        fi

        if [ -n "${DF_WORKER_HEADERS}" ]; then
          IFS=',' read -ra whdrs <<< "${DF_WORKER_HEADERS}"
          for h in "${whdrs[@]}"; do
            [ -n "${h}" ] && args+=( --worker_headers="${h}" )
          done
        fi

        [ "${DF_FAIL_ON_DEAD}" = "true" ] && args+=( --fail-on-dead )

        # `--fail-on-dead` makes deadfinder exit 2 when it finds something, and
        # under `set -e` that would abort the step right here — before the report
        # is published as a step output, which is the whole reason the caller ran
        # the scan. So hold the status, publish the output, and re-raise it as
        # this step's exit code at the very end.
        scan_status=0
        /tmp/deadfinder "${args[@]}" || scan_status=$?

        if [ ! -f /tmp/output.json ]; then
          echo "::error::/tmp/output.json was not produced"
          exit 1
        fi

        # A step output is a single line, so only JSON can be flattened by
        # stripping newlines. YAML/TOML/CSV/SARIF are newline-significant and
        # go through the heredoc form of $GITHUB_OUTPUT instead.
        if [ "${fmt}" = "json" ]; then
          if command -v jq >/dev/null 2>&1; then
            encoded=$(jq -c . /tmp/output.json)
          else
            encoded=$(tr -d '\n' < /tmp/output.json)
          fi
          echo "output=${encoded}" >> "$GITHUB_OUTPUT"
        else
          {
            echo "output<<DEADFINDER_OUTPUT_EOF"
            cat /tmp/output.json
            echo "DEADFINDER_OUTPUT_EOF"
          } >> "$GITHUB_OUTPUT"
        fi

        # 2 = dead findings under `--fail-on-dead`; anything else non-zero is a
        # real failure. Either way the report is already published above.
        if [ "${scan_status}" -eq 2 ]; then
          echo "::error title=Dead links found::deadfinder exited 2 (see the step output for the report)"
        fi
        exit "${scan_status}"
